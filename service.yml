name: drupal-vinyl
type: service
from: vinyl
fromVersionConstraint: "^1.0.0"
fromVersion: "1.0.5"
title: Vinyl (Drupal)


labels:
- drupal
- varnish
- vinyl

configs:
- name: drupal
  title: Drupal preset
  filepath: /etc/gotpl/preset/drupal.vcl.tmpl
  default:
    source: image
    filepath: /etc/gotpl/presets/drupal.vcl.tmpl

env:
- name: VARNISH_CONFIG_PRESET
  value: drupal
# Big headers in Drupal Cache-tags.
- name: VARNISHD_PARAM_HTTP_RESP_HDR_LEN
  value: 16k
